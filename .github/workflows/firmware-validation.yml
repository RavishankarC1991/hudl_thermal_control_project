name: Firmware Validation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  firmware-validation:
    name: Run simulated firmware validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run code quality checks
        run: ruff check src tests

      - name: Run Robot Framework firmware validation tests
        run: robot -d results/robot robot_tests

      - name: Run Pytest unit tests
        run: pytest -v

      - name: Run normal fan simulation
        run: python -m thermal_qa.simulate_faults --scenario normal --pwm 60

      - name: Run fan stall fault simulation
        run: python -m thermal_qa.simulate_faults --scenario stalled_fan --pwm 70

      - name: Run tachometer missing fault simulation
        run: python -m thermal_qa.simulate_faults --scenario tacho_missing --pwm 70

      - name: Upload Robot Framework reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-reports
          path: results/robot